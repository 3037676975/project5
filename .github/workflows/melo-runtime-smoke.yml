name: Project5 MeloTTS Real CPU Smoke

on:
  push:
    branches: [main]
    paths:
      - 'app/dual_tts.py'
      - 'scripts/melo_worker.py'
      - 'scripts/setup-melo.sh'
      - 'scripts/start-melo.sh'
      - 'scripts/stop-melo.sh'
      - '.github/workflows/melo-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  real-melo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and start isolated MeloTTS runtime
        env:
          MELO_THREADS: '2'
        run: bash scripts/setup-melo.sh
      - name: Real mixed Chinese-English generation
        env:
          MELO_THREADS: '2'
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          health = json.loads(urllib.request.urlopen('http://127.0.0.1:8016/health', timeout=5).read())
          assert health['service_ready'] is True, health

          payload = json.dumps({
              'text': '今天我们测试 MeloTTS。Have you ever wondered how AI generated voices work? 接下来学习 LangChain、RAG、MCP 和 API。',
              'voice': 'melo-zh',
              'speed': 1.0,
              'filename': 'tts_ci_melo.wav',
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'http://127.0.0.1:8016/synthesize',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          started = time.perf_counter()
          data = json.loads(urllib.request.urlopen(req, timeout=600).read())
          elapsed = time.perf_counter() - started
          assert data['ok'] is True, data
          wav = Path('data/audio/tts_ci_melo.wav')
          assert wav.exists() and wav.stat().st_size > 44
          print('melo-real-ok', data, 'elapsed=', round(elapsed, 2), 'bytes=', wav.stat().st_size)
          PY
      - name: Melo logs on failure
        if: failure()
        run: |
          tail -n 200 logs/melo-setup.log 2>/dev/null || true
          tail -n 200 logs/melo.log 2>/dev/null || true
