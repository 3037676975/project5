name: Project5 MeloTTS Integration Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-melo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile app/dual_tts.py scripts/melo_worker.py
      - name: Shell syntax
        run: |
          bash -n scripts/setup-melo.sh
          bash -n scripts/start-melo.sh
          bash -n scripts/stop-melo.sh
          bash -n scripts/start.sh
          bash -n scripts/stop.sh
          bash -n scripts/auto-deploy.sh
      - name: Tri-engine wiring
        run: |
          grep -q 'MELO_ENGINE = "melo"' app/dual_tts.py
          grep -q 'melo-zh' app/dual_tts.py
          grep -q 'MeloTTS 本地试听' app/static/console-v2.html
          grep -q 'progress-ring' app/static/console-v2.html
          grep -q 'engine=melo' app/static/console-v2.html
          grep -q 'myshell-ai/MeloTTS.git' scripts/setup-melo.sh
      - name: Official model contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/melo_worker.py').read_text(encoding='utf-8')
          assert 'TTS(language="ZH", device="cpu")' in text
          assert 'melo-zh' in text
          assert 'ZH_MIX_EN' in Path('app/dual_tts.py').read_text(encoding='utf-8')
          print('melo-integration-static-check-ok')
          PY
