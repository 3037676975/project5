name: Project5 BaoTa Routing Selfcheck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n scripts/auto-deploy.sh
          bash -n scripts/ensure-baota-proxy.sh
          bash -n scripts/start.sh
          bash -n scripts/stop.sh
          bash -n scripts/restart.sh

      - name: Known-good BaoTa deploy path from f4a24ef
        run: |
          grep -q 'Project5 · Verified Webhook Deploy' scripts/auto-deploy.sh
          grep -q '\[1/5\]' scripts/auto-deploy.sh
          grep -q '\[5/5\]' scripts/auto-deploy.sh
          grep -q 'scripts/restart.sh' scripts/auto-deploy.sh
          grep -q '代码、端口新进程、线上 commit、新功能四层一致' scripts/auto-deploy.sh
          ! grep -q 'bash .*ensure-baota-proxy.sh' scripts/auto-deploy.sh
          ! grep -q 'public_is_current' scripts/auto-deploy.sh
          ! grep -q 'nginx -t' scripts/auto-deploy.sh

      - name: Nginx repair remains a separate manual utility
        run: |
          grep -q 'PROJECT5-AUTO-PROXY-START' scripts/ensure-baota-proxy.sh
          grep -q 'nginx' scripts/ensure-baota-proxy.sh
          grep -q 'proxy_pass http://127.0.0.1' scripts/ensure-baota-proxy.sh

      - name: Chinese API learning docs
        run: |
          grep -q 'API 到底是什么' API_DOCS.md
          grep -q '202 Accepted' API_DOCS.md
          grep -q 'GET /v1/tasks/{id}' API_DOCS.md
          grep -q 'Python 调用完整示例' API_DOCS.md
          grep -q 'API 中文入门' app/static/api-guide-zh.html
          grep -q 'API Key = 通行证' app/static/api-guide-zh.html
