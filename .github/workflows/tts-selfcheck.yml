name: Project5 TTS Selfcheck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt httpx

      - name: Install official Misaki English frontend
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          pip install 'spacy>=3.8,<4' 'transformers>=4.40,<5' 'num2words>=0.5.14,<1'
          python -m spacy download en_core_web_sm

      - name: Syntax checks
        run: |
          python -m compileall -q app
          python -m py_compile scripts/build-voice-previews.py
          bash -n scripts/auto-deploy.sh
          bash -n scripts/repair-runtime-assets.sh
          bash -n scripts/bootstrap-runtime.sh
          bash -n scripts/setup-kokoro-english.sh
          bash -n scripts/start.sh
          bash -n scripts/stop.sh
          bash -n scripts/restart.sh

      - name: Official English G2P direct tests
        run: |
          python - <<'PY'
          from misaki import en
          from misaki.espeak import EspeakFallback
          fallback = EspeakFallback(british=False, version='1.1')
          g2p = en.G2P(version='1.1', trf=False, british=False, fallback=fallback, unk='')
          for text in (
              'Have you ever wondered how AI-generated voices work?',
              'OpenAI, ChatGPT, LangChain, RAG, MCP, LLM and API are useful tools.',
          ):
              phonemes, _ = g2p(text)
              assert phonemes and '❓' not in phonemes, (text, phonemes)
              print('english-g2p-ok:', text, phonemes)
          PY

      - name: Download verified Kokoro v1.1 zh assets
        run: |
          mkdir -p models
          curl -fL --retry 5 -o models/kokoro-v1.1-zh.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.1-zh.onnx
          curl -fL --retry 5 -o models/voices-v1.1-zh.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.1-zh.bin
          curl -fL --retry 5 -o models/config.json \
            https://huggingface.co/hexgrad/Kokoro-82M-v1.1-zh/resolve/main/config.json
          echo '859f9ded9f53be16c24857cdab3254a45da53c3afd5ba6ef134c7de3f822e326  models/kokoro-v1.1-zh.onnx' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('models/voices-v1.1-zh.bin')
          assert p.stat().st_size == 53815880
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist()) == 103 and z.testzip() is None
          print('kokoro-assets-ok')
          PY

      - name: Kokoro real pure English and alternating code-switch generation
        env:
          KOKORO_THREADS: '4'
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          from app.dual_tts import generate_kokoro
          from app.tts import engine

          cases = {
              'english': 'Have you ever wondered how AI-generated voices work? Open-source TTS models are getting surprisingly powerful.',
              'switches': '嗨，今天聊点轻松的。I really like simple tools that just work. 最近我在用 ChatGPT 和 LangChain 做 AI 小工具，and it feels pretty useful. 好，我们继续吧。',
          }
          for name, text in cases.items():
              target = Path(f'/tmp/project5-{name}.wav')
              duration = generate_kokoro(text, 'zf_001', 1.0, target)
              assert target.exists() and target.stat().st_size > 44
              info = sf.info(str(target))
              assert info.frames > 0 and info.duration > 0
              print(name, 'ok', target.stat().st_size, duration, engine.english_frontend, engine.last_metrics.get('mixed_boundary'))
          assert engine.english_frontend == 'misaki-en-g2p+espeak-fallback', engine.english_frontend
          assert engine.load_metrics.get('mixed_boundary') == 'soft-join-v1', engine.load_metrics
          assert engine.last_metrics.get('mixed_boundary') == 'soft-join-v1', engine.last_metrics
          PY

      - name: Edge TTS real online generation
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          import edge_tts
          from mutagen.mp3 import MP3
          target = Path('/tmp/project5-edge.mp3')
          text = '嗨，今天聊点轻松的。I really like simple tools that just work. 最近我们继续测试 Edge TTS。'
          for attempt in range(1, 4):
              try:
                  target.unlink(missing_ok=True)
                  edge_tts.Communicate(text,'zh-CN-XiaoxiaoNeural').save_sync(str(target))
                  assert target.stat().st_size > 512 and MP3(str(target)).info.length > 0
                  print('edge-real-generation-ok')
                  break
              except Exception:
                  if attempt == 3: raise
                  time.sleep(attempt * 2)
          PY

      - name: Real FastAPI dual-engine task flow
        env:
          ADMIN_KEY: ci-project5-admin
          KOKORO_THREADS: '4'
        run: |
          rm -f data/project5.db
          mkdir -p data/audio logs
          python - <<'PY'
          import time
          from pathlib import Path
          from fastapi.testclient import TestClient
          from app.entry import app

          headers = {'X-Admin-Key': 'ci-project5-admin'}
          def wait(client, task_id):
              deadline = time.time() + 180
              while time.time() < deadline:
                  task = client.get(f'/admin/tasks/{task_id}', headers=headers).json()
                  if task['status'] == 'completed': return task
                  if task['status'] == 'failed': raise RuntimeError(task.get('error'))
                  time.sleep(0.5)
              raise TimeoutError(task_id)

          with TestClient(app) as client:
              k = client.post('/admin/speech', headers=headers, json={
                  'input':'嗨，今天聊点轻松的。I really like simple tools that just work. 最近我们继续学习 LangChain，and it feels useful. 好，我们继续。',
                  'engine':'kokoro','voice':'zf_001','speed':1.0})
              e = client.post('/admin/speech', headers=headers, json={
                  'input':'今天测试 Edge TTS。','engine':'edge','voice':'zh-CN-XiaoxiaoNeural','speed':1.0})
              assert k.status_code == 202 and e.status_code == 202
              kt, et = wait(client,k.json()['id']), wait(client,e.json()['id'])
              assert Path('data/audio',kt['audio_filename']).stat().st_size > 44
              assert Path('data/audio',et['audio_filename']).stat().st_size > 512
              print('api-dual-ok', kt['id'], et['id'])
          PY
